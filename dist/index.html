<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跑得快记分</title>
<style>
:root {
  --felt-dark: #0c3b20;
  --felt: #14532d;
  --felt-light: #1b6b3a;
  --gold: #d4af37;
  --gold-soft: #f0d98c;
  --cream: #fffdf6;
  --ink: #1f2937;
  --win: #b45309;
  --lose: #047857;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {

}
body::before {
  content: "♠"; position: fixed; top: -40px; right: -30px; font-size: 220px;
  color: rgba(255,255,255,.045); pointer-events: none; z-index: 0;
}
body::after {
  content: "♥"; position: fixed; bottom: -50px; left: -30px; font-size: 240px;
  color: rgba(0,0,0,.12); pointer-events: none; z-index: 0;
}
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); position: relative; z-index: 1; }
h1 { font-size: 24px; color: var(--gold-soft); text-shadow: 0 1px 2px rgba(0,0,0,.4); letter-spacing: 2px; }
.card { background: var(--cream); color: var(--ink); border-radius: 16px; padding: 16px; margin-bottom: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.28), inset 0 0 0 1px rgba(212,175,55,.25); }
.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 600;
  background: #ece7d8; color: var(--ink); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.btn-primary { background: linear-gradient(180deg, var(--felt-light), #135231); color: var(--gold-soft);

.btn-danger { background: #7f1d1d; color: #fecaca; }
.btn-hero { padding: 19px 15px 17px; font-size: 21px; letter-spacing: 2px; }
.btn-hero small { display: block; margin-top: 5px; font-size: 12.5px; font-weight: 500; letter-spacing: 0;
  color: rgba(240,217,140,.72); text-shadow: none; }
.btn-ghost { background: rgba(255,255,255,.05); color: var(--gold-soft); border: 1px solid rgba(240,217,140,.32);
  font-size: 15px; font-weight: 600; padding: 12px; box-shadow: none; }
.btn-sm { display: inline-block; width: auto; padding: 9px 14px; font-size: 14px; border-radius: 10px; box-shadow: none; border: 1px solid #d1cbb8; }

.neg { color: var(--lose); font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip.on { background: var(--felt-light); border-color: var(--gold); color: var(--gold-soft); font-weight: 700; }
.overlay { position: fixed; inset: 0; background: rgba(4,24,13,.72); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
input[type=text] { width: 100%; padding: 12px; border: 1.5px solid #d1cbb8; border-radius: 10px; font-size: 16px; background: #fff; color: var(--ink); }
.muted { color: rgba(255,253,246,.78); font-size: 13px; }
.card .muted { color: #6b7280; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 6px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 700; border: 0; cursor: pointer; }
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.topbar .title { font-weight: 800; font-size: 18px; color: var(--gold-soft); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.back { border: 0; background: none; font-size: 16px; color: var(--gold-soft); padding: 4px; cursor: pointer; }
.section-title { font-weight: 700; margin-bottom: 10px; }
.gap { height: 10px; }
.sync-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(0,0,0,.28);
  border: 1px solid rgba(212,175,55,.4); color: var(--gold-soft); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }

.sync-dot.off { background: #f59e0b; }
.topbar .actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.topbar.has-actions .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { background: rgba(0,0,0,.28); color: var(--gold-soft); border: 1px solid rgba(212,175,55,.4);
  border-radius: 10px; padding: 7px 12px; font-size: 15px; cursor: pointer; }
.sheet-mask { position: fixed; inset: 0; background: rgba(4,24,13,.62); z-index: 60; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-width: 520px; margin: 0 auto; background: var(--cream); color: var(--ink);
  border-radius: 18px 18px 0 0; padding: 6px 12px calc(10px + env(safe-area-inset-bottom));
  max-height: 90vh; overflow-y: auto; }
.sheet-item { display: block; width: 100%; border: 0; background: none; padding: 16px; font-size: 17px;
  color: var(--ink); text-align: center; cursor: pointer; border-bottom: 1px solid #eee; }
.sheet-item:last-child { border-bottom: 0; }
.sheet-item.danger { color: #b91c1c; }
.sheet-item.cancel { margin-top: 6px; font-weight: 700; }
.sheet .muted { color: #6b7280; }  /* 面板是米色底，.muted 默认的近白色在这里看不见 */

/* 头像行：谁赢了点谁 */
/* overflow-x:auto 会让另一轴也变成 auto（CSS 规范），「我」头像那圈 2px 金环

.seat .pts { display: block; font-size: 13px; font-weight: 800; }
/* 座位里的身份药丸压在头像右下角：不占名字那行、也不额外撑高一行。
   .proxy-tag 在流水里还是行内用法，所以这套定位只作用在 .seat 内 */
.seat .ava-wrap { position: relative; display: block; width: 48px; margin: 0 auto; }
.seat .me-tag, .seat .proxy-tag, .seat .left-tag {
  position: absolute; right: -5px; bottom: 3px; margin: 0; padding: 0 5px;
  font-size: 10px; line-height: 15px; white-space: nowrap;
  border: 1.5px solid var(--cream);   /* 描一圈米色，压在深色头像上也不糊成一团 */
}
.seat .me-tag { background: var(--gold); color: #4a3a08; }   /* 「我」用醒目金底，一眼看到自己 */
.seat.me .ava { box-shadow: 0 0 0 2px var(--gold); }
.seat.left { opacity: .45; }
.left-tag { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 999px;
  background: #9ca3af; color: #fff; font-size: 11px; font-weight: 700; }
.tip { background: rgba(0,0,0,.28); border: 1px solid rgba(212,175,55,.4); color: var(--gold-soft);
  border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
/* 首页提示条：进不去房间之类的坏消息走这里，不用阻塞的 alert */
.notice { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.3);
  border: 1px solid rgba(212,175,55,.45); color: var(--gold-soft);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
.notice-x { margin-left: auto; flex-shrink: 0; border: 0; background: none;
  color: var(--gold-soft); font-size: 20px; line-height: 1; padding: 0 4px; cursor: pointer; }
/* 流水里的时间分隔：居中小灰药丸，把同一局的几笔视觉上归成一组 */
.tx-time { text-align: center; margin: 12px 0 4px; }
.tx-time:first-child { margin-top: 2px; }
.tx-time span { display: inline-block; padding: 2px 10px; border-radius: 999px;
  background: #e9e4d5; color: #6b7280; font-size: 12px; }
.who { color: #1d4ed8; font-weight: 700; }
.amt { font-weight: 800; font-size: 17px; flex-shrink: 0; }
/* 支出弹窗 */
.pay { position: relative; width: 100%; max-width: 340px; background: var(--cream); color: var(--ink);
  border-radius: 18px; padding: 22px 18px 18px; }
.pay .muted { color: #6b7280; }
.pay-x { position: absolute; top: 6px; right: 10px; border: 0; background: none;
  font-size: 26px; line-height: 1; color: #9ca3af; cursor: pointer; }
.pay-head { display: flex; align-items: flex-start; justify-content: space-between; margin: 6px 0 16px; }
.pay-who { flex: 1; border: 0; background: none; padding: 0; text-align: center; color: var(--ink); cursor: pointer; }
.pay-who .ava { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px;
  margin: 0 auto 5px; border-radius: 50%; color: #fff; font-size: 22px; font-weight: 700; }
.pay-who .nm { display: block; font-size: 14px; font-weight: 700; }
.pay-who .muted { display: block; font-size: 11px; margin-top: 2px; }
.pay-arrow { flex: 0 0 90px; text-align: center; color: #6b7280; font-size: 14px; padding-top: 16px; line-height: 1.6; }
.pay-hint { text-align: center; margin: 8px 0 14px; }
.sheet-head { padding: 14px 16px 6px; text-align: center; font-weight: 700; color: var(--ink); }

</style>
