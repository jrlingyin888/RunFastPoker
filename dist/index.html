<body>
<div id="app"></div>
<!--RUNFAST_HOST-->
<script>
// 跑得快结算纯函数。金额一律以"分"（整数）计算。
// 浏览器：全局 RunfastLogic；Node：module.exports（供测试）。
var RunfastLogic = (function () {
  'use strict';

  const HAND_SIZE = 10;
  const SHUTOUT_MULTIPLIER = 2;

  // 元字符串 -> 分。非法（非数字/超两位小数/<=0）返回 NaN。
  function yuanToFen(str) {
    if (typeof str !== 'string' || !/^\d+(\.\d{1,2})?$/.test(str.trim())) return NaN;
    const fen = Math.round(parseFloat(str) * 100);
    return fen > 0 ? fen : NaN;
  }

  // 分 -> 元字符串，去多余的零：100->'1'，50->'0.5'，105->'1.05'
  function fenToYuan(fen) {
    const sign = fen < 0 ? '-' : '';
    const abs = Math.abs(fen);
    const yuan = Math.floor(abs / 100);
    const rest = abs % 100;
    if (rest === 0) return sign + yuan;
    let dec = (rest < 10 ? '0' : '') + rest;
    if (dec[1] === '0') dec = dec[0];
    return sign + yuan + '.' + dec;
  }

  // 输家本局实际计的牌数（全关双倍）
  function countedCards(loser) {
    return loser.shutout ? loser.cardsLeft * SHUTOUT_MULTIPLIER : loser.cardsLeft;
  }

  // 一局的转账明细（剩 0 张不计）
  function roundTransfers(round, priceFen) {
    return round.losers
      .filter((l) => l.cardsLeft > 0)
      .map((l) => {
        const cards = countedCards(l);
        return { from: l.name, to: round.winner, cards, fen: cards * priceFen };
      });
  }

  // 转账流水对净额的贡献：一笔 = from 减 points 分、to 加 points 分。
  // 返回 {名字: 净分}，只含流水里出现过的人。
  function transferNet(session) {
    const out = Object.create(null);
    (session.transfers || []).forEach((t) => {
      out[t.from] = (out[t.from] || 0) - t.points;
      out[t.to] = (out[t.to] || 0) + t.points;
    });
    return out;
  }

  // 整场累计净额。同时吃「按局记」的 rounds 和「按笔记」的 transfers，两者相加——
  // 历史旧场只有 rounds、新场只有 transfers，没打完的旧场两边都有，因而不需要数据迁移。
  // 包含 session.players 中所有人（未参与者为 0），顺序同 players。
  function sessionNet(session) {
    const net = Object.create(null);
    const entry = (n) => (net[n] ||= { name: n, cards: 0, fen: 0 });
    session.players.forEach(entry);
    (session.rounds || []).forEach((round) => {
      roundTransfers(round, session.pricePerCardFen).forEach((t) => {
        entry(t.from).cards -= t.cards; entry(t.from).fen -= t.fen;
        entry(t.to).cards += t.cards;   entry(t.to).fen += t.fen;
      });
    });
    const tn = transferNet(session);
    Object.keys(tn).forEach((n) => {
      const e = entry(n);
      e.cards += tn[n];
      e.fen += tn[n] * session.pricePerCardFen;
    });
    return session.players.map((n) => net[n]);
  }

  // 最简转账：欠最多的与赢最多的贪心配对，笔数 <= 人数-1
  function settleUp(net) {
    const debtors = [], creditors = [];
    net.forEach((p) => {
      if (p.fen < 0) debtors.push({ name: p.name, fen: -p.fen });
      else if (p.fen > 0) creditors.push({ name: p.name, fen: p.fen });
    });
    debtors.sort((a, b) => b.fen - a.fen);
    creditors.sort((a, b) => b.fen - a.fen);
    const out = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const pay = Math.min(debtors[i].fen, creditors[j].fen);
      out.push({ from: debtors[i].name, to: creditors[j].name, fen: pay });
      debtors[i].fen -= pay; creditors[j].fen -= pay;
      if (debtors[i].fen === 0) i++;
      if (creditors[j].fen === 0) j++;
    }
    return out;
  }

  // 一场的规模文案：旧场按「局」数，新的流水场按「笔」数（新场 rounds 恒为空，不然会显示「共 0 局」）。
  // 升级前开着的半场后来又接着记，两者都有，就两个都报，别把已经记过的那部分藏起来。
  function sessionSize(session) {
    const rounds = (session.rounds || []).length;
    const tx = (session.transfers || []).length;
    const parts = [];
    if (rounds) parts.push(rounds + ' 局');
    if (tx) parts.push(tx + ' 笔');
    return parts.join(' ') || '0 笔';
  }

  const pad2 = (n) => String(n).padStart(2, '0');

  // 战绩纯文本（复制到聊天工具）
  function summaryText(session) {
    const d = new Date(session.createdAt);
    const lines = [];
    lines.push('【跑得快战绩】' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));
    lines.push('共 ' + sessionSize(session) + ' · ' + fenToYuan(session.pricePerCardFen) + '元/张');
    lines.push('— 盈亏 —');
    sessionNet(session)
      .slice().sort((a, b) => b.fen - a.fen)
      .forEach((p) => lines.push(p.name + '：' + (p.fen > 0 ? '+' : '') + fenToYuan(p.fen) + ' 元'));
    const pays = settleUp(sessionNet(session));
    if (pays.length) {
      lines.push('— 转账 —');
      pays.forEach((t) => lines.push(t.from + ' → ' + t.to + '：' + fenToYuan(t.fen) + ' 元'));
    }
    return lines.join('\n');
  }

  const api = { HAND_SIZE, yuanToFen, fenToYuan, countedCards, roundTransfers, transferNet, sessionNet, settleUp, sessionSize, summaryText };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

</script>
<script>
// 联机同步：局域网自建服务器（同源 REST + SSE，无 SDK、无第三方依赖）。
// 浏览器全局 RunfastSync；Node 下 module.exports 供纯函数测试。
var RunfastSync = (function () {
  'use strict';

  // 页面由主机服务器（server.js）发出时会注入 window.__RUNFAST_HOST__=true
  const configured = () => (typeof window !== 'undefined' && window.__RUNFAST_HOST__ === true);

  // ---------- 纯函数（与 v1.1 一致，原样保留）----------
  function genRoomCode(rand) {
    const r = rand || Math.random;
    let s = '';
    for (let i = 0; i < 6; i++) s += Math.floor(r() * 10);
    return s;
  }
  const validRoomCode = (s) => typeof s === 'string' && /^[0-9]{6}$/.test(s);

  // 从粘贴进来的任意文本里抠出 6 位房号：整条邀请链接、群里那段邀请话、或者干脆就是 6 位数字。
  // 优先认 room= 参数（我们自己链接的格式，最可靠），再认「房号 xxxxxx」，最后才找孤立的 6 位数。
  // 不用 (?<!\d) 这种后行断言——iOS 16.4 之前的 Safari 不支持，整个脚本会直接语法错误。
  function parseRoomCode(text) {
    if (typeof text !== 'string') return null;
    // 全角数字先转半角：中文输入法和某些复制粘贴会带全角
    const s = text.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
    const byParam = s.match(/room=(\d{6})(?!\d)/i);
    if (byParam) return byParam[1];
    const byLabel = s.match(/房号[^\d]{0,4}(\d{6})(?!\d)/);
    if (byLabel) return byLabel[1];
    const bare = s.match(/(?:^|\D)(\d{6})(?!\d)/);
    return bare ? bare[1] : null;
  }

  // SSE put 事件 → 本地房间镜像
  function applyEvent(room, path, data) {
    if (path === '/' || room == null) return data;
    const keys = path.replace(/^\//, '').split('/');
    const next = JSON.parse(JSON.stringify(room));
    let node = next;
    for (let i = 0; i < keys.length - 1; i++) node = node[keys[i]] ||= {};
    const last = keys[keys.length - 1];
    if (data === null) delete node[last];
    else node[last] = data;
    return next;
  }

  // 兜底：把可能缺失的 map 字段补回（幂等，无害）
  function normalizeRoom(room) {
    if (room) { room.players ||= {}; room.tx ||= {}; }
    return room;
  }

  // ---------- 房间纯函数 ----------
  // 唯一 key：并发写落在不同 key 上，服务器逐个落盘就不会互相覆盖。
  function newKey(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // 按设备 id 找回自己那条玩家记录 —— 回归房间认的是设备，不是名字。
  function findMyPid(room, uid) {
    if (!room || !room.players || !uid) return null;
    return Object.keys(room.players).find((pid) => room.players[pid].uid === uid) || null;
  }

  // 在玩的人数（已退出的不算）
  function playingCount(room) {
    const ps = (room && room.players) || {};
    return Object.keys(ps).filter((pid) => !ps[pid].left).length;
  }

  // 名字是否被别人占了。流水按名字展示，重名就认不出谁是谁，所以进房和改名都要挡。
  function nameTaken(room, name, exceptPid) {
    const ps = (room && room.players) || {};
    return Object.keys(ps).some((pid) => pid !== exceptPid && ps[pid].name === name);
  }

  // 某个时刻房里有几个人（中途才加入的还没来、已经退出的不算）
  function roomSizeAt(players, at) {
    return Object.keys(players || {}).filter((pid) => {
      const p = players[pid];
      if ((p.at || 0) > at) return false;                  // 那会儿还没进来
      if (p.left && (p.leftAt || 0) <= at) return false;   // 那会儿已经走了
      return true;
    }).length;
  }

  // 把升序流水切成「一局一组」。跑得快一局的形状就是「其余人各给赢家转一笔」，
  // 所以一组 = 连续的、收款人相同、付款人不重复、且不超过这一局开打时的（人数-1）笔。
  // 「满员笔数」必须按开打那一刻的人数算而不是当前人数：3 个人时一局最多 2 笔，
  // 中途加到 4 人后才是 3 笔——用当前人数会让旧的一局多空一格，把新加入者的第一笔
  // 吸进上一局，看着像他参与了那局。同理，开打时还没进房的人也一律另起一局。
  const ROUND_BREAK_GAP = 10 * 60 * 1000;   // 兜底：中途吃个饭回来不算同一局
  function groupRounds(list, players, offset) {
    const ps = players || {};
    const groups = [];
    (list || []).forEach((t) => {
      const at = t.at || 0;
      const g = groups[groups.length - 1];
      const payer = ps[t.from];
      const sameRound = g && g.to === t.to
        && !g.items.some((x) => x.from === t.from)     // 同一个人不会在一局里付两次
        && g.items.length < g.max
        && (!payer || (payer.at || 0) <= g.start)      // 这局开打时他还没进房
        && at - g.end < ROUND_BREAK_GAP;
      if (sameRound) { g.items.push(t); g.end = at; }
      else groups.push({ to: t.to, items: [t], start: at, end: at,
        max: Math.max(1, roomSizeAt(ps, at) - 1) });
    });
    groups.forEach((g, i) => { g.no = (offset || 0) + i + 1; });
    return groups;
  }

  // 流水 map → 按时间升序的数组
  function txList(room) {
    const tx = (room && room.tx) || {};
    return Object.keys(tx)
      .map((id) => Object.assign({ id }, tx[id]))
      .sort((a, b) => (a.at || 0) - (b.at || 0));
  }

  // ---------- 设备身份（取代 Firebase 匿名认证）----------
  const DEV_KEY = 'runfast.device';
  let deviceId = null;
  function newId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  async function signIn() {
    if (deviceId) return { uid: deviceId };
    try {
      deviceId = localStorage.getItem(DEV_KEY);
      if (!deviceId) { deviceId = newId(); localStorage.setItem(DEV_KEY, deviceId); }
    } catch (e) { if (!deviceId) deviceId = newId(); } // localStorage 不可用则仅内存态
    return { uid: deviceId };
  }
  const getUid = () => deviceId;

  // ---------- REST（同源相对路径，带 X-Device-Id）----------
  const roomUrl = (code) => '/rooms/' + code;

  async function readRoom(code) {
    const res = await fetch(roomUrl(code));
    if (!res.ok) throw new Error('读取失败 ' + res.status);
    return { data: normalizeRoom(await res.json()) };
  }

  // HTTP 状态码挂在 error 上：调用方要靠它区分「服务端拒了」和「网络挂了」，
  // 才能给出「这个名字刚被人用了」这种能看懂的提示，而不是笼统的失败。
  function httpError(msg, status) {
    const e = new Error(msg);
    e.status = status;
    return e;
  }

  async function writeRoom(code, data) {
    const res = await fetch(roomUrl(code), {
      method: data === null ? 'DELETE' : 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Device-Id': deviceId },
      body: data === null ? undefined : JSON.stringify(data),
    });
    if (res.status === 403) throw httpError('没有修改权限', 403);
    if (!res.ok) throw httpError('写入失败 ' + res.status, res.status);
  }

  // 字段级写：只更新指定路径（各人填各自那格互不覆盖）。403 → 服务端校验没过（名字被占/座位已被占等）。
  async function patch(code, path, value) {
    const res = await fetch(roomUrl(code), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Device-Id': deviceId },
      body: JSON.stringify({ path, value }),
    });
    if (res.status === 403) throw httpError('没有权限或座位已被占', 403);
    if (!res.ok) throw httpError('操作失败 ' + res.status, res.status);
  }

  // 建房：房号试 5 次，建房人自己就是第一个玩家。
  async function createRoom(init) {
    await signIn();
    for (let i = 0; i < 5; i++) {
      const code = genRoomCode();
      const { data } = await readRoom(code);
      if (data !== null) continue; // 房号被占用，换一个
      const pid = newKey('p_');
      try {
        await writeRoom(code, {
          creatorUid: deviceId,
          sid: 's' + Date.now(),
          createdAt: new Date().toISOString(),
          pricePerCardFen: init.pricePerCardFen,
          status: 'active',
          players: { [pid]: { name: init.name, uid: deviceId, at: Date.now() } },
          tx: {},
        });
      } catch (e) {
        // 读到「没人用」和真正写进去之间，别人可能刚好占了这个号：服务端禁止整房覆盖 ⇒ 403。
        // 这是「换个号重试」的场景，不是错误——直接冲出循环的话用户看到的是词不达意的
        // 「建房失败：没有修改权限」。非 403（网络挂了、服务端 500）照旧抛出去。
        if (e.status !== 403) throw e;
        continue;
      }
      return { code, pid };
    }
    throw new Error('建房失败，请重试');
  }

  async function deleteRoom(code) {
    await writeRoom(code, null);
  }

  // ---------- SSE 订阅（同源，无 token）----------
  let es = null, currentCode = null, cb = null, room = null, retryTimer = null, gen = 0;

  async function subscribe(code, callbacks) {
    close();
    currentCode = code;
    cb = callbacks;
    openStream();
  }

  function openStream() {
    const g = ++gen;
    clearTimeout(retryTimer);
    if (es) { es.close(); es = null; }
    if (!currentCode) return;
    if (cb && cb.onStatus) cb.onStatus('connecting');
    es = new EventSource(roomUrl(currentCode) + '/events');
    es.addEventListener('put', onEvt);
    es.onopen = () => { if (g === gen && cb && cb.onStatus) cb.onStatus('connected'); };
    es.onerror = () => {
      if (g !== gen) return;
      if (cb && cb.onStatus) cb.onStatus('connecting');
      // 初始连接失败时浏览器置 CLOSED 且不再自动重试，需手动重开
      if (es && es.readyState === EventSource.CLOSED) scheduleRetry();
    };
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => openStream(), 3000);
  }

  function onEvt(e) {
    if (!cb) return; // close() 之后到达的迟到事件
    const { path, data } = JSON.parse(e.data);
    room = normalizeRoom(applyEvent(room, path, data));
    if (room === null) { if (cb.onDeleted) cb.onDeleted(); return; }
    if (cb.onRoom) cb.onRoom(room);
  }

  function close() {
    gen++;
    clearTimeout(retryTimer);
    if (es) es.close();
    es = null; room = null; currentCode = null; cb = null;
  }

  const api = { configured, genRoomCode, validRoomCode, parseRoomCode,
    newKey, findMyPid, playingCount, nameTaken, txList, roomSizeAt, groupRounds,
    applyEvent, normalizeRoom, signIn, getUid, createRoom, readRoom, subscribe, patch, writeRoom, deleteRoom, close };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

</script>
<script>
// 与业务无关的展示工具：转义、顶栏、底部弹出面板、剪贴板、头像取色。
// 浏览器：全局 RunfastUI；Node：module.exports（供测试）。
var RunfastUI = (function () {
  'use strict';

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const validName = (s) => /^[^'"<>\\]{1,8}$/.test(s);

  // 没有真实头像，用名字首字 + 一个稳定色块代替。
  // 同一个名字在每台设备上算出同一个颜色，牌友之间看到的头像才是一致的。
  const AVATAR_BG = ['#1b6b3a', '#b45309', '#1d4ed8', '#7c3aed', '#be123c', '#0f766e', '#a16207', '#4338ca'];
  function avatarColor(name) {
    let h = 0;
    const s = String(name);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return AVATAR_BG[h % AVATAR_BG.length];
  }
  // 按码点取首字，否则 emoji 名字会被劈成半个字符渲染成乱码
  const initial = (name) => Array.from(String(name))[0] || '?';

  // 顶栏。title 一律过 esc()：现有调用点传的都是字面量或数字派生串，但标题是最容易
  // 「顺手把房号/名字拼进去」的位置，这个分支已经为「用户数据进 HTML」栽过两次，不留这个形状。
  // ⚠️ backJs / actionsHtml 是当 JS 源码 / HTML 片段用的，esc() 在这两个位置不起作用：
  //    只能传硬编码字面量，任何外部可控数据（玩家名、pid、房号…）都必须走 data-* + 事件委托。
  const topbar = (title, backJs, actionsHtml) =>
    `<div class="topbar${actionsHtml ? ' has-actions' : ''}">${backJs ? `<button class="back" onclick="${backJs}">‹ 返回</button>` : ''}<div class="title">${esc(title)}</div>${actionsHtml ? `<span class="actions">${actionsHtml}</span>` : ''}</div>`;

  // 底部弹出面板。挂在 body 上而不是 #app 里，这样房间广播频繁重绘 #app 时面板不会被抖掉。
  // ⚠️ items[].onclick 同 topbar 的 backJs：当 JS 源码用，只能传硬编码字面量。
  // items 支持 onclick（静态、不带用户数据的按钮用）或 data（{key: value}，渲染成 data-key="esc(value)"，
  // 配合调用方自己装的事件委托读取——带「玩家」这类外部数据的按钮一律走 data，不拼进内联 onclick 的
  // JS 字符串：那是 esc() 管不到的上下文，属性值上的 esc() 才是真正安全的。
  function closeSheet() { const el = document.getElementById('sheet'); if (el) el.remove(); }
  function openSheet(items, headerHtml) {
    closeSheet();
    const el = document.createElement('div');
    el.id = 'sheet';
    el.className = 'sheet-mask';
    el.innerHTML = `<div class="sheet">
      ${headerHtml || ''}
      ${items.map((it) => `<button class="sheet-item${it.danger ? ' danger' : ''}"${
        it.onclick ? ` onclick="${it.onclick}"` : ''}${
        it.data ? Object.keys(it.data).map((k) => ` data-${k}="${esc(it.data[k])}"`).join('') : ''
      }>${esc(it.label)}</button>`).join('')}
      <button class="sheet-item cancel">取消</button>
    </div>`;
    // 按钮的内联 onclick（或调用方装的 data-* 委托）先在目标上执行，这个委托监听随后关闭面板
    el.addEventListener('click', (ev) => {
      if (ev.target === el || ev.target.classList.contains('sheet-item')) closeSheet();
    });
    document.body.appendChild(el);
  }

  async function copyToClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }
  }

  const api = { esc, validName, avatarColor, initial, topbar, openSheet, closeSheet, copyToClipboard };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

</script>
<script>
// 战绩图 Canvas 绘制 + 分享：navigator.share(files) -> 长按保存降级 -> 桌面下载
var RunfastShare = (function () {
  'use strict';

  const W = 640, PAD = 40, LINE_H = 58;

  function drawCard(session, L) {
    const net = L.sessionNet(session).slice().sort((a, b) => b.fen - a.fen);
    const pays = L.settleUp(L.sessionNet(session));
    const d = new Date(session.createdAt);
    const dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

    const headH = 170;
    const netH = 54 + net.length * LINE_H;
    const payH = pays.length ? 54 + pays.length * LINE_H : 0;
    const footH = 80;
    const H = headH + netH + payH + footH;

    const scale = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
    const cv = document.createElement('canvas');
    cv.width = W * scale;
    cv.height = H * scale;
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);

    const font = (w, s) => { ctx.font = w + ' ' + s + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'; };

    // 牌桌绿背景
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#14532d');
    bg.addColorStop(1, '#0c3b20');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 标题区
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    font(700, 36);
    ctx.fillText('🃏 跑得快战绩', W / 2, 72);
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    font(400, 24);
    ctx.fillText(dateStr + ' · 共 ' + L.sessionSize(session) + ' · ' + L.fenToYuan(session.pricePerCardFen) + '元/张', W / 2, 116);
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.moveTo(PAD, 150); ctx.lineTo(W - PAD, 150); ctx.stroke();

    // 盈亏区
    let y = headH + 30;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    font(600, 22);
    ctx.fillText('盈 亏', PAD, y);
    y += 16;
    net.forEach((p) => {
      y += LINE_H;
      ctx.fillStyle = '#ffffff';
      font(600, 28);
      ctx.textAlign = 'left';
      ctx.fillText(p.name, PAD, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = p.fen > 0 ? '#fbbf24' : p.fen < 0 ? '#86efac' : 'rgba(255,255,255,.6)';
      font(700, 28);
      ctx.fillText((p.fen > 0 ? '+' : '') + L.fenToYuan(p.fen) + ' 元', W - PAD, y);
    });

    // 转账区
    if (pays.length) {
      y += 60;
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      font(600, 22);
      ctx.fillText('转 账', PAD, y);
      y += 16;
      pays.forEach((t) => {
        y += LINE_H;
        ctx.fillStyle = '#ffffff';
        font(400, 26);
        ctx.textAlign = 'left';
        ctx.fillText(t.from + ' → ' + t.to, PAD, y);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fbbf24';
        font(700, 26);
        ctx.fillText(L.fenToYuan(t.fen) + ' 元', W - PAD, y);
      });
    }

    // 页脚
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    font(400, 20);
    ctx.fillText('跑得快记分器', W / 2, H - 34);

    return cv;
  }

  const toBlob = (cv) => new Promise((res) => cv.toBlob(res, 'image/png'));

  async function share(session, L) {
    const cv = drawCard(session, L);
    const blob = await toBlob(cv);
    if (!blob) { alert('生成图片失败，请截图代替'); return; }
    const file = new File([blob], '跑得快战绩.png', { type: 'image/png' });
    // 1) 系统分享面板（iOS Safari 15+ / Android Chrome）
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: '跑得快战绩' }); return; }
      catch (e) { if (e.name === 'AbortError') return; /* 其余错误走降级 */ }
    }
    fallback(blob);
  }

  // 2) 手机降级：预览 + 长按保存；3) 桌面降级：直接下载
  function fallback(blob) {
    const url = URL.createObjectURL(blob);
    if (!('ontouchstart' in window)) {
      const a = document.createElement('a');
      a.href = url;
      a.download = '跑得快战绩.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return;
    }
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML =
      '<div style="text-align:center;max-width:100%">' +
      '<img src="' + url + '" style="max-width:100%;max-height:70vh;border-radius:12px" alt="战绩图">' +
      '<div style="color:#fff;margin-top:12px;font-size:15px">长按图片即可保存或转发</div>' +
      '<button class="btn btn-sm" style="margin-top:12px">关闭</button></div>';
    ov.addEventListener('click', (ev) => {
      if (ev.target === ov || ev.target.tagName === 'BUTTON') {
        ov.remove();
        URL.revokeObjectURL(url);
      }
    });
    document.body.appendChild(ov);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 取服务器 /qr 的二维码 SVG，转成能画进 canvas 的 Image（确保带 width/height，Safari 才能按尺寸栅格化；纯 path SVG 不污染画布）
  function loadQr(text, size) {
    return fetch('qr?text=' + encodeURIComponent(text))
      .then((r) => { if (!r.ok) throw new Error('qr ' + r.status); return r.text(); })
      .then((svg) => new Promise((resolve, reject) => {
        if (!/<svg[^>]*\swidth=/.test(svg)) svg = svg.replace('<svg', '<svg width="' + size + '" height="' + size + '"');
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('qr img'));
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }));
  }

  // 邀请卡：牌桌绿底 + 大房号 + 二维码 + 扫码提示。返回 canvas。（异步：要先把二维码抓下来）
  async function drawInviteCard(code, link) {
    const W = 560, H = 736;
    const scale = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
    const cv = document.createElement('canvas');
    cv.width = W * scale;
    cv.height = H * scale;
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    const font = (w, s) => { ctx.font = w + ' ' + s + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'; };

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#14532d');
    bg.addColorStop(1, '#0c3b20');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0d98c';
    font(800, 40);
    ctx.fillText('🃏 跑得快记分', W / 2, 92);

    ctx.fillStyle = 'rgba(255,255,255,.6)';
    font(500, 26);
    ctx.fillText('房号', W / 2, 150);
    ctx.fillStyle = '#ffffff';
    font(800, 66);
    ctx.fillText(String(code), W / 2, 222);

    // 二维码：白色圆角底（必须有白底，扫码才认）+ 画上二维码
    const qrSize = 300, qrPad = 22, qrBox = qrSize + qrPad * 2;
    const bx = (W - qrBox) / 2, by = 260;
    roundRect(ctx, bx, by, qrBox, qrBox, 18);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    const qr = await loadQr(link, qrSize);
    ctx.drawImage(qr, bx + qrPad, by + qrPad, qrSize, qrSize);

    const hy = by + qrBox;
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    font(700, 28);
    ctx.fillText('微信 / 浏览器 扫码进房', W / 2, hy + 50);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    font(400, 23);
    ctx.fillText('一起记分，输赢自动算', W / 2, hy + 84);

    ctx.fillStyle = 'rgba(255,255,255,.3)';
    font(400, 20);
    ctx.fillText('跑得快记分器', W / 2, H - 26);
    return cv;
  }

  const api = { share, drawCard, drawInviteCard, toBlob };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

</script>
<script>
// 联机/本地记分房间：状态、进房、头像行、流水、支出弹窗、结算与退出。
// 联机时 state.room 是云端房间（players/tx 都是 map）；本地单机时 state.local=true，
// 用 state.session（db 里那条本地场）现搭一个同形状的房间，两边共用同一套视图与交互。
var RunfastRoom = (function () {
  'use strict';
  const S = RunfastSync, U = RunfastUI, L = RunfastLogic;
  const esc = U.esc;

  // 宿主接线：app.js 启动时注入路由、名录、结束回调
  let host = {
    go() {}, render() {}, view() { return {}; },
    directory() { return []; }, onFinished() {}, onVoided() {}, saveName() {}, saveLocal() {},
  };
  function init(h) { host = Object.assign(host, h); }

  const state = { active: false, local: false, code: null, room: null, session: null,
    uid: null, pid: null, status: 'idle', payFrom: null, payTo: null };

  const LAST_NAME_KEY = 'runfast.lastName';
  const ROOM_KEY = 'runfast.sync.room';
  function lastName() { try { return localStorage.getItem(LAST_NAME_KEY) || ''; } catch (e) { return ''; } }

  // ---------- 进房 ----------
  // 先只读一次房间，再决定去哪：
  //   还在房里（没点过退出）→ 直接回记分页。刷新、切后台回来、重新扫码都走这条，
  //     用户没退出就不该被拦一道确认页——这是最常见的路径，必须一步到位。
  //   退出过 / 没进过 → 输名字页（退出过的会预填原名，可改，位置和分数不变）。
  // opts.silent：开机自动回房用，房间没了就安静回首页，不要弹窗吓人。
  async function preview(code, opts) {
    const silent = !!(opts && opts.silent);
    try {
      await S.signIn();
      state.uid = S.getUid();
      const { data } = await S.readRoom(code);
      if (data === null) {
        // 房间不在了（房主关了房、或服务端数据被清）。别弹阻塞的 alert，也别把人丢到
        // 「加入房间」页去重试一个已经不存在的房号——那只会让他反复点、反复失败。
        // 回首页 + 一条能关掉的提示，想干别的随时干。
        forgetSavedRoom(code);
        host.go({ name: 'home', notice: '房间 ' + code + ' 进不去了，可能房主已经关闭它。' });
        return;
      }
      const pid = S.findMyPid(data, state.uid);
      state.room = data;
      if (pid && !data.players[pid].left) { await attach(code, pid); return; }
      // 字段叫 myName 不叫 name —— 路由对象上的 name 是视图名（'joinName'），撞了会把视图名渲染进输入框
      host.go({ name: 'joinName', code, pid, myName: pid ? data.players[pid].name : lastName() });
    } catch (e) {
      // 网络抽风：房间多半还在，别清本机记的房号，回首页提示一下让他重试
      if (silent) { host.go({ name: 'home' }); return; }
      host.go({ name: 'home', notice: '连不上房间 ' + code + '，检查下网络再试。' });
    }
  }
  // 本机记着的就是这个房号才清掉，免得误删另一个还有效的
  function forgetSavedRoom(code) {
    try {
      const saved = JSON.parse(localStorage.getItem(ROOM_KEY) || 'null');
      if (saved && saved.code === code) localStorage.removeItem(ROOM_KEY);
    } catch (e) { /* 忽略 */ }
  }

  // ---------- 输名字 / 确认回归 ----------
  function joinView() {
    const v = host.view();
    const back = !!v.pid;   // 本机在这房间有过身份 → 这页是「确认回来」而不是「新加入」
    const dir = host.directory();
    return `
      ${U.topbar((back ? '回到房间 ' : '加入房间 ') + v.code, 'App.goHome()')}
      <div class="card">
        ${back ? `<div class="muted" style="margin-bottom:10px">你之前是「${esc(v.myName)}」，改个名也行，位置和分数不变。</div>` : ''}
        <div class="section-title">你的名字</div>
        <input type="text" id="myName" maxlength="8" placeholder="输入你的名字（8 字以内）" value="${esc(v.myName || '')}">
        ${dir.length ? `<div class="chips" style="margin-top:10px">${dir.map((n) =>
          `<button class="chip" onclick="Room.fillName('${esc(n)}')">${esc(n)}</button>`).join('')}</div>` : ''}
      </div>
      <button class="btn btn-primary" onclick="Room.confirmJoin()">${back ? '回到房间' : '进入房间'}</button>`;
  }

  // ---------- 本地单机 ----------
  // 用本地场现搭一个同形状的房间：pid 就是名字（本地没有设备身份，也就没有「我」）。
  function localRoom(session) {
    const players = Object.create(null);
    session.players.forEach((n, i) => { players[n] = { name: n, uid: null, at: i }; });
    const tx = Object.create(null);
    (session.transfers || []).forEach((t) => { tx[t.id] = t; });
    return { creatorUid: null, sid: session.id, createdAt: session.createdAt,
      pricePerCardFen: session.pricePerCardFen, status: session.status, players, tx };
  }
  function startLocal(session) {
    resetState();   // 用 resetState 不用 close：别把「回到联机房间」的房号也顺手清了
    state.active = true; state.local = true;
    state.session = session; state.room = localRoom(session);
    state.pid = null; state.status = 'connected';
    host.go({ name: 'room' });
  }
  // 本地写入：直接改 db 里那条场，再让 app.js 落盘重绘
  function localApply(fn) {
    fn(state.session);
    state.room = localRoom(state.session);
    host.saveLocal();
  }

  // ---------- 净额与快照 ----------
  // 每人当前净分。本地场可能还带着旧的 rounds，交给 logic 一起算。
  function netOf() {
    if (state.local) {
      const out = Object.create(null);
      L.sessionNet(state.session).forEach((p) => { out[p.name] = p.cards; });
      return out;
    }
    const r = state.room, net = Object.create(null);
    Object.keys(r.players).forEach((pid) => { net[pid] = 0; });
    S.txList(r).forEach((t) => {
      if (net[t.from] === undefined || net[t.to] === undefined) return;  // 引用了不存在的人，跳过
      net[t.from] -= t.points;
      net[t.to] += t.points;
    });
    return net;
  }

  // 把当前房间快照成一个 session：名字取快照，历史因此不依赖房间还在不在。
  function snapshot() {
    if (state.local) return state.session;
    const r = state.room;
    const nameOf = (pid) => (r.players[pid] || {}).name || '?';
    const pids = Object.keys(r.players).sort((a, b) => (r.players[a].at || 0) - (r.players[b].at || 0));
    return {
      id: r.sid,
      createdAt: r.createdAt,
      pricePerCardFen: r.pricePerCardFen,
      players: pids.map(nameOf),
      status: r.status === 'finished' ? 'finished' : 'active',
      finishedAt: r.finishedAt,
      rounds: [],
      transfers: S.txList(r).map((t) => ({ id: t.id, from: nameOf(t.from), to: nameOf(t.to),
        points: t.points, at: t.at })),
    };
  }

  // ---------- 记分主页 ----------
  function seatHtml(pid, points) {
    const p = state.room.players[pid];
    const left = !!p.left;
    const tag = left ? '<span class="left-tag">已退出</span>'
      : (!state.local && pid === state.pid) ? '<span class="me-tag">我</span>'
      : (!state.local && p.uid == null) ? '<span class="proxy-tag">代</span>' : '';
    const sign = points > 0 ? '+' : '';
    // 身份小药丸叠在头像右下角：跟着名字排会被 nowrap+省略号裁掉（「丽叶已退出」只剩「丽叶…」），
    // 自成一行又会把整列撑高一截。压在头像角上两个毛病都没有。
    return `<button class="seat${left ? ' left' : ''}${(!state.local && pid === state.pid) ? ' me' : ''}"
        data-room-act="seat" data-pid="${esc(pid)}">
      <span class="ava-wrap">
        <span class="ava" style="background:${U.avatarColor(p.name)}">${esc(U.initial(p.name))}</span>${tag}
      </span>
      <span class="nm">${esc(p.name)}</span>
      <span class="pts ${points > 0 ? 'pos' : points < 0 ? 'neg' : ''}">${sign}${points}</span>
    </button>`;
  }

  function txRowHtml(t) {
    const r = state.room;
    const from = r.players[t.from], to = r.players[t.to];
    if (!from || !to) return '';
    // 代记：提交这笔的设备不是付款人本人（本地单机没有设备身份，不标）
    const proxy = (!state.local && t.byUid && from.uid !== t.byUid) ? deviceName(t.byUid) : '';
    return `<div class="row">
      <span><b class="who">${esc(from.name)}</b> 记分给 <b class="who">${esc(to.name)}</b>${
        proxy ? ` <span class="proxy-tag">${esc(proxy)}代记</span>` : ''}</span>
      <span class="amt">${t.points}</span>
    </div>`;
  }
  // 流水按「一局」分组，每组顶上标一次时间（不是每笔都标）。
  // 跑得快一局的形状就是「其余人各给赢家转一笔」，所以一组 =
  // 连续的、收款人相同、付款人不重复、且不超过（在场人数-1）笔。
  // 比按固定时长切准得多：一局打得快打得慢都不影响分组。
  // 只留一个很宽松的时间兜底，免得中途吃个饭回来还算同一局。
  const pad2 = (n) => String(n).padStart(2, '0');
  function timeLabel(at, withSec) {
    const d = new Date(at);
    const now = new Date();
    const sameDay = d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return (sameDay ? '' : (d.getMonth() + 1) + '月' + d.getDate() + '日 ')
      + pad2(d.getHours()) + ':' + pad2(d.getMinutes())
      + (withSec ? ':' + pad2(d.getSeconds()) : '');
  }
  // 吃升序流水，吐倒序 HTML（最新在上）：每组顶上标该组最后一笔的时间。
  // 只在相邻两组撞进同一分钟时才精确到秒——那种情况只标分钟会看着像重复渲染；
  // 平时不显示秒，一排数字读起来累。
  function txListHtml(list, players) {
    const groups = S.groupRounds(list, players);
    const mins = groups.map((g) => timeLabel(g.end, false));
    const out = [];
    for (let i = groups.length - 1; i >= 0; i--) {
      const clash = mins[i] === mins[i - 1] || mins[i] === mins[i + 1];
      out.push(`<div class="tx-time"><span>${timeLabel(groups[i].end, clash)}</span></div>`
        + groups[i].items.slice().reverse().map(txRowHtml).join(''));
    }
    return out.join('');
  }

  // 设备 id → 该设备绑定的玩家名（找不到就空字符串）
  function deviceName(uid) {
    const ps = state.room.players;
    const pid = Object.keys(ps).find((k) => ps[k].uid === uid);
    return pid ? ps[pid].name : '';
  }

  function roomView() {
    const r = state.room;
    // attach() 订阅完就立刻跳这一页，而 state.room 要等 SSE 第一帧才有。
    // 返回空串的话，微信内置浏览器 + 弱网下用户看到的是一整页空白：零按钮零文字，
    // 连返回和房号都没有，只能杀进程。给个能看出「在干什么」且退得出去的占位。
    if (!r) {
      return `
        ${U.topbar('连接中…' + (state.code ? ' · 房号 ' + state.code : ''), 'App.goHome()')}
        <div class="card">
          <div class="muted">正在连接房间${state.code ? ' ' + esc(state.code) : ''}，网络慢的话要几秒……</div>
        </div>
        <button class="btn" onclick="App.goHome()">返回首页</button>`;
    }
    const price = L.fenToYuan(r.pricePerCardFen);
    const list = S.txList(r);          // 升序；txListHtml 负责分组、插时间戳、倒序输出
    const net = netOf();
    const pids = Object.keys(r.players).sort((a, b) => (r.players[a].at || 0) - (r.players[b].at || 0));
    const actions = (state.local ? '' : '<button class="icon-btn" onclick="Room.share()">分享</button>')
      + '<button class="icon-btn" onclick="Room.more()">⋯</button>';
    const bar = state.local ? ''
      : `<div class="sync-bar"><span><span class="sync-dot ${state.status === 'connected' ? '' : 'off'}"></span>房号 ${esc(state.code)} · ${S.playingCount(r)} 人在玩</span></div>`;
    // 升级前记的半场本地牌局只有 rounds 没有 transfers：只数 tx 会显示「已记 0 笔」，
    // 而头像上明明有分，看着像分丢了。本地场一律交给 sessionSize 按「局/笔」算。
    const oldRounds = state.local ? (state.session.rounds || []).length : 0;
    const size = state.local ? L.sessionSize(state.session) : S.txList(r).length + ' 笔';
    return `
      ${U.topbar('已记 ' + size + ' · ' + price + '元/张', 'App.goHome()', actions)}
      ${bar}
      <div class="card">
        <div class="players">
          ${pids.map((pid) => seatHtml(pid, net[pid] || 0)).join('')}
          <button class="seat" onclick="Room.addMenu()">
            <span class="ava add">＋</span><span class="nm">加人</span><span class="pts">&nbsp;</span>
          </button>
        </div>
      </div>
      <div class="tip">谁赢了就点谁的头像${state.local ? '' : ' · 点自己头像改名或退出'}</div>
      <div class="card">
        ${txListHtml(list, r.players) || (oldRounds ? '' : '<div class="muted">还没有记录，谁赢了就点谁的头像</div>')}
        ${oldRounds ? `<div class="muted">这一场升级前按「局」记过 ${oldRounds} 局，分已经算进上面的头像里；从现在起每记一笔都会列在这里。</div>` : ''}
      </div>`;
  }

  // ---------- 支出弹窗 ----------
  // 独立的 overlay（不走 openSheet），因为要控制「校验没过时不关窗」。
  function closePay() {
    const el = document.getElementById('pay');
    if (el) el.remove();
    state.payTo = null;
    // payFrom 故意不清：本地单机没有「我」，下次开支出框要沿用这次选的付款人（见 openPay 的注释）
  }
  // 能当付款人的：不是收款人自己、且没退出。排序口径和 pickPayer 一致（按加入时间），
  // 否则兜底挑的人和面板上第一个人不是同一个，看着像随机的。
  function payerCandidates(toPid) {
    const ps = state.room.players;
    return Object.keys(ps)
      .filter((pid) => pid !== toPid && !ps[pid].left)
      .sort((a, b) => (ps[a].at || 0) - (ps[b].at || 0));
  }
  // preselect === false：从「有人给我记分」进来的。收款人是我、付款人只能是别人，
  // 而这一步正是用户要做的选择；替他默认选一个，输个数字点「支出」就把分记到别人头上了，
  // 流水又只增不删（只能反向再记一笔冲掉）。这条路径要求先显式点一次选人。
  function openPay(toPid, preselect) {
    const cands = payerCandidates(toPid);
    if (!cands.length) { alert('房间里还没有别人，先加个人吧'); return; }
    state.payTo = toPid;
    // 联机默认「我付」；本地单机没有「我」，沿用上次选的付款人（由 closePay 保留）
    if (!state.local) state.payFrom = state.pid;
    const fromOk = state.payFrom && state.payFrom !== toPid
      && state.room.players[state.payFrom] && !state.room.players[state.payFrom].left;
    if (!fromOk) state.payFrom = preselect === false ? null : cands[0];
    renderPay();
  }
  function renderPay() {
    const r = state.room;
    const from = state.payFrom ? r.players[state.payFrom] : null;  // 还没选付款人时为 null
    const to = r.players[state.payTo];
    const keep = (document.getElementById('payPoints') || {}).value || '';
    let el = document.getElementById('pay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'pay';
      el.className = 'overlay';
      document.body.appendChild(el);
    }
    el.innerHTML = `<div class="pay">
      <button class="pay-x" onclick="Room.closePay()">×</button>
      <div class="pay-head">
        <button class="pay-who" onclick="Room.pickPayer()">
          ${from
            ? `<span class="ava" style="background:${U.avatarColor(from.name)}">${esc(U.initial(from.name))}</span>
               <span class="nm">${esc(from.name)} ▾</span><span class="muted">点这里换人</span>`
            : `<span class="ava" style="background:#9ca3af">?</span>
               <span class="nm">选择付款人 ▾</span><span class="muted">点这里选人</span>`}
        </button>
        <div class="pay-arrow"><div>支出 分数</div><div>→</div></div>
        <div class="pay-who">
          <span class="ava" style="background:${U.avatarColor(to.name)}">${esc(U.initial(to.name))}</span>
          <span class="nm">${esc(to.name)}</span><span class="muted">赢家</span>
        </div>
      </div>
      <input type="text" id="payPoints" inputmode="numeric" placeholder="输入支出分数"
             value="${esc(keep)}" oninput="Room.previewPay(this.value)">
      <div class="muted pay-hint" id="payHint">${payHint(keep)}</div>
      <button class="btn btn-primary" ${from ? '' : 'disabled style="opacity:.4"'} onclick="Room.submitPay()">支出</button>
    </div>`;
    const inp = document.getElementById('payPoints');
    if (inp) inp.focus();
  }
  // 输入实时折算成钱；没填就提示单价。校验口径必须和 submitPay 一致——
  // 否则 '1e3'/'99999'/'12.5' 这类会被提交拒掉的输入，这里却显示着看似正常的金额或默认提示，
  // 用户会以为能提交、点了才发现不行。
  function payHint(v) {
    const raw = String(v).trim();
    const price = state.room.pricePerCardFen;
    if (!raw) return '1 分 = ' + L.fenToYuan(price) + ' 元 · 全关就输 20';
    const n = Number(raw);
    if (!/^\d+$/.test(raw) || !Number.isInteger(n) || n <= 0 || n > 9999) return '请输入 1～9999 的整数分数';
    return n + ' 分 = ' + L.fenToYuan(n * price) + ' 元';
  }

  // ---------- 订阅并进入记分页 ----------
  async function attach(code, pid) {
    await S.signIn();
    state.uid = S.getUid();          // 建房那条路没走过 preview()，这里补上设备 id
    state.active = true; state.local = false;
    state.code = code; state.pid = pid; state.status = 'connecting';
    try { localStorage.setItem(ROOM_KEY, JSON.stringify({ code })); } catch (e) { /* 忽略 */ }
    await S.subscribe(code, {
      onRoom(room) {
        state.room = room;
        if (room.status === 'finished') { finishLocally(); return; }
        // 只重绘、不跳转：进房那一下 attach 末尾已经跳过了。这里再跳的话，
        // 人跑去首页/历史看东西时，房里别人一记分就把他拽回记分页。
        if (['room', 'rounds', 'settle'].includes(host.view().name)) host.render();
      },
      onStatus(st) {
        state.status = st;
        if (host.view().name === 'room') host.render();
      },
      onDeleted() {
        const mine = state.room && state.room.creatorUid === state.uid;
        close();
        if (!mine) alert('房间已被关闭');
        host.go({ name: 'home' });
      },
    });
    host.go({ name: 'room' });
  }

  // 结束本场：各端把快照存进自己手机的历史，然后断开连接跳结算页。
  // 建房人保留房号，好在结算页上把房间从服务器删掉。
  function finishLocally() {
    const snap = snapshot();
    const mine = !!(state.room && state.room.creatorUid === state.uid);
    const code = state.code, room = state.room;
    close();
    if (mine) { state.code = code; state.room = room; }
    host.onFinished(snap);
  }

  // 断开并清空内存态（不动 localStorage）
  function resetState() {
    S.close();
    closePay();   // 支出弹窗可能还开着（房间被删/结算/退出这类打断），别让黑色蒙层卡在下一页上
    state.active = false; state.local = false; state.code = null;
    state.room = null; state.session = null; state.pid = null; state.status = 'idle';
    state.payFrom = null; state.payTo = null;
  }
  // 主动退出 / 房间被关：额外忘掉「回到联机房间」入口，首页就不再显示它
  function close() {
    resetState();
    try { localStorage.removeItem(ROOM_KEY); } catch (e) { /* 忽略 */ }
  }

  // 邀请链接与邀请卡图片缓存（供分享面板用；下次分享时释放旧的）
  const inviteLink = () => location.origin + location.pathname + '?room=' + state.code;
  let inviteBlob = null, inviteUrl = null;

  // ---------- 交互（视图里的 onclick 走这里）----------
  const Room = {
    fillName(n) {
      const el = document.getElementById('myName');
      if (el) el.value = n;
    },

    // 进房：本机在这房间有过身份就复用同一个 pid（清掉退出标记、按需改名），
    // 否则建一个新玩家。认的是设备 id，不是名字。
    async confirmJoin() {
      const v = host.view();
      const name = (document.getElementById('myName').value || '').trim();
      if (!U.validName(name)) { alert('名字需 1～8 个字，且不能含引号等特殊符号'); return; }
      if (S.nameTaken(state.room, name, v.pid || undefined)) {
        alert('房间里已经有人叫「' + name + '」了，换一个吧'); return;
      }
      try {
        let pid = v.pid;
        if (pid) {
          const me = state.room.players[pid];
          if (me.name !== name) await S.patch(v.code, '/players/' + pid + '/name', name);
          if (me.left) {
            await S.patch(v.code, '/players/' + pid + '/left', null);
            await S.patch(v.code, '/players/' + pid + '/leftAt', null);
          }
        } else {
          pid = S.newKey('p_');
          await S.patch(v.code, '/players/' + pid,
            { name, uid: state.uid, at: Date.now() });
        }
        host.saveName(name);
        await attach(v.code, pid);
      } catch (e) {
        // 上面的 nameTaken 查的是 preview() 那一刻的快照；用户在这一页停留的十几秒里
        // 别人同名进了房，只有服务端在写入这一刻才看得见 ⇒ 403。这条路径上的 403 只可能是重名
        // （清 left/leftAt 走的是自己那条记录，权限恒过），给一条能直接照做的提示。
        if (e.status === 403) { alert('这个名字刚被人用了，换一个吧'); return; }
        alert('进入房间失败：' + e.message);
      }
    },

    // 退出：只打个 left 标记，玩家和已记的分一笔都不删。
    // 想回来就让牌友把房号或二维码发过来，重进会自动认回原位置。
    async leave() {
      if (!confirm('退出房间？分数会留在房间里，想回来让牌友把房号或二维码发给你。')) return;
      if (!state.local) {
        try {
          await S.patch(state.code, '/players/' + state.pid + '/left', true);
          await S.patch(state.code, '/players/' + state.pid + '/leftAt', Date.now());
        } catch (e) { /* 网络不好也让他走，回来时重新认设备即可 */ }
      }
      close();
      host.go({ name: 'home' });
    },

    tapSeat(pid) {
      const p = state.room.players[pid];
      if (!p) return;
      if (p.left) { alert('该用户已退出房间'); return; }
      if (!state.local && pid === state.pid) { Room.mePanel(); return; }
      openPay(pid);
    },

    closePay() { closePay(); },
    previewPay(v) {
      const el = document.getElementById('payHint');
      if (el) el.textContent = payHint(v);
    },
    pickPayer() {
      const r = state.room;
      const items = payerCandidates(state.payTo).map((pid) => ({
        label: r.players[pid].name + (!state.local && pid === state.pid ? '（我）' : ''),
        data: { 'room-act': 'payer', pid },
      }));
      U.openSheet(items, '<div class="sheet-head">谁支出这笔分？</div>');
    },
    setPayer(pid) { state.payFrom = pid; renderPay(); },

    async submitPay() {
      const raw = ((document.getElementById('payPoints') || {}).value || '').trim();
      const n = Number(raw);
      if (!/^\d+$/.test(raw) || !Number.isInteger(n) || n <= 0 || n > 9999) {
        alert('请输入 1～9999 的整数分数'); return;
      }
      const ps = state.room.players;
      const from = state.payFrom, to = state.payTo;
      if (!from) { alert('先点上面的头像选一下：这笔分是谁支出的'); return; }
      // 弹窗开着的这段时间房间可能变了（对方退出、甚至联机端收到别的设备的广播）——提交前复查一遍，
      // 不能光信弹窗打开那一刻缓存的 from/to 还有效。
      if (!ps[from] || ps[from].left || !ps[to] || ps[to].left) {
        alert('TA 已退出房间');
        if (!ps[to] || ps[to].left) closePay(); else openPay(to);
        return;
      }
      if (from === to) { alert('不能给自己记分'); return; }
      const tx = { from, to, points: n, byUid: state.uid || null, at: Date.now() };
      if (state.local) {
        localApply((s) => {
          s.transfers = (s.transfers || []).concat([{ id: S.newKey('t_'),
            from: state.room.players[from].name, to: state.room.players[to].name, points: n, at: tx.at }]);
        });
        closePay();
        return;
      }
      try {
        await S.patch(state.code, '/tx/' + S.newKey('t_'), tx);
        closePay();
      } catch (e) { alert('记分失败，请重试：' + e.message); }
    },

    // ＋：邀请牌友扫码 / 直接加没带手机的人
    addMenu() {
      const items = [{ label: '➕ 加没带手机的人', onclick: 'Room.addOffline()' }];
      if (!state.local) items.unshift({ label: '📤 邀请牌友扫码', onclick: 'Room.share()' });
      U.openSheet(items);
    },
    async addOffline() {
      const name = (window.prompt('加个人（没带手机的，大家都能替 TA 记分）：', '') || '').trim();
      if (!name) return;
      if (!U.validName(name)) { alert('名字需 1～8 个字，且不能含引号等特殊符号'); return; }
      if (S.nameTaken(state.room, name)) { alert('房间里已经有人叫这个名字了'); return; }
      host.saveName(name);
      // 本地场的数据形状里 players（花名册）和 activePlayers（在场）并存，只 push 前者的话，
      // 旧的（还没接线到 RunfastRoom 的）视图会把新人当成「已离场」——两个数组一起同步。
      if (state.local) { localApply((s) => { s.players.push(name); if (s.activePlayers) s.activePlayers.push(name); }); return; }
      try { await S.patch(state.code, '/players/' + S.newKey('p_'), { name, uid: null, at: Date.now() }); }
      catch (e) {
        // 服务端在写入这一刻做最终重名判定（本机看到的房间可能已经旧了几秒）
        if (e.status === 403) { alert('这个名字刚被人用了，换一个吧'); return; }
        alert('加人失败：' + e.message);
      }
    },

    // 分享：先生成「邀请卡」图片（房号+二维码），弹面板——主按钮把图片走系统分享（牌友收到图直接扫码进房），
    // 次按钮走系统分享发链接文字，长按卡片存整张。生成失败退回旧的简单面板（房号+二维码+复制），不卡住。
    async share() {
      const link = inviteLink(), code = state.code;
      let cv;
      try { cv = await RunfastShare.drawInviteCard(code, link); }
      catch (e) { Room.shareFallback(); return; }
      const blob = await RunfastShare.toBlob(cv);
      if (!blob) { Room.shareFallback(); return; }
      if (inviteUrl) URL.revokeObjectURL(inviteUrl);
      inviteBlob = blob;
      inviteUrl = URL.createObjectURL(blob);
      const header = `<div style="text-align:center;padding:4px 0 2px">
        <img src="${inviteUrl}" alt="扫码进房" style="width:100%;max-width:270px;border-radius:14px;display:block;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.35)">
        <div class="muted" style="margin-top:10px">长按上图保存整张 · 或用下面按钮发出去</div>
      </div>`;
      U.openSheet([
        { label: '📤 分享二维码图片', onclick: 'Room.shareInviteImage()' },
        { label: '🔗 分享链接文字', onclick: 'Room.shareInviteLink()' },
        { label: '复制链接', onclick: 'Room.copyInvite()' },
      ], header);
    },

    // 主：把邀请卡当图片文件走系统分享（微信/群里收到的是图，直接扫码进房）；不支持文件分享则桌面下载 / 手机提示长按
    async shareInviteImage() {
      if (!inviteBlob) return;
      const file = new File([inviteBlob], '跑得快房间' + (state.code || '') + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: '跑得快记分', text: '扫码进房记分（房号 ' + state.code + '）' }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      if (!('ontouchstart' in window)) { const a = document.createElement('a'); a.href = inviteUrl; a.download = file.name; a.click(); }
      else alert('长按上面的图片即可保存或转发到微信');
    },

    // 次：走系统分享把邀请链接文字发出去（需要可点链接时用）；无系统分享则退回复制
    async shareInviteLink() {
      const link = inviteLink();
      if (navigator.share) {
        try { await navigator.share({ title: '跑得快记分', text: '一起来记分（房号 ' + state.code + '）', url: link }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      Room.copyInvite();
    },

    shareFallback() {
      const link = inviteLink();
      const header = `<div style="text-align:center;padding:10px 0 4px">
        <div class="muted">房号</div>
        <div style="font-size:34px;font-weight:800;letter-spacing:4px">${U.esc(state.code)}</div>
        <img src="qr?text=${encodeURIComponent(link)}" alt="扫码进房" onerror="this.remove()"
             style="width:180px;height:180px;margin:10px auto 6px;display:block">
        <div class="muted">让牌友扫码，或复制链接发群里</div>
        <div class="muted" style="word-break:break-all;margin-top:4px">${U.esc(link)}</div>
      </div>`;
      U.openSheet([{ label: '复制链接', onclick: 'Room.copyInvite()' }], header);
    },

    async copyInvite() {
      const ok = await U.copyToClipboard('来跑得快记分房间围观/记分：' + inviteLink() + '（房号 ' + state.code + '）');
      alert(ok ? '邀请链接已复制，发到群里吧' : '复制失败，请手动把房号告诉牌友：' + state.code);
    },

    // 点自己头像：替别人记一笔给我 / 改昵称 / 退出房间
    mePanel() {
      const p = state.room.players[state.pid];
      U.openSheet([
        // 「谁赢了点谁的头像」记的是「我付给 TA」，自己赢了就得由输的人点。可输的人不一定有手机
        // （＋加进来的代记玩家），或干脆只有我这一台设备在记——没有这个入口就永远记不上自己赢的分。
        { label: '💰 有人给我记分', onclick: 'Room.payMe()' },
        { label: '✏️ 更新昵称', onclick: 'Room.rename()' },
        { label: '🚪 退出房间', onclick: 'Room.leave()', danger: true },
      ], `<div class="sheet-head">${esc(p.name)}</div>`);
    },
    // 收款人是我；付款人不预选，必须自己点一次（记一笔就删不掉，见 openPay 的注释）
    payMe() { openPay(state.pid, false); },

    async rename() {
      if (state.local) { alert('本地单机没有「我」，改名请点那个人的头像旁边的加人重来'); return; }
      const p = state.room.players[state.pid];
      const next = (window.prompt('把「' + p.name + '」改成：', p.name) || '').trim();
      if (!next || next === p.name) return;
      if (!U.validName(next)) { alert('名字需 1～8 个字，且不能含引号等特殊符号'); return; }
      if (S.nameTaken(state.room, next, state.pid)) { alert('房间里已经有人叫这个名字了'); return; }
      try { await S.patch(state.code, '/players/' + state.pid + '/name', next); host.saveName(next); }
      catch (e) {
        // 同 confirmJoin：本机的重名判断基于可能已过期的房间快照，服务端才是最终裁决
        if (e.status === 403) { alert('这个名字刚被人用了，换一个吧'); return; }
        alert('改名失败：' + e.message);
      }
    },

    // ⋯：结算方案随时可看，结束本场谁都能点
    more() {
      const items = [
        { label: '💰 结算方案', onclick: 'Room.settle()' },
        { label: '🏁 结束本场', onclick: 'Room.finish()' },
      ];
      if (!state.local) {
        items.push({ label: '✏️ 改我的昵称', onclick: 'Room.rename()' });
        items.push({ label: '🚪 退出房间', onclick: 'Room.leave()', danger: true });
      } else {
        items.push({ label: '🚪 回首页', onclick: 'App.goHome()' });
        // 本地场只能有一个 active，没有出口就锁死了：新开一场、一笔没记就返回首页，
        // 「开新一场（本地）」从此消失（首页只剩「继续本场」），而「结束本场」又要求至少记过一笔——
        // 用户只能记一笔假账或清浏览器数据才能脱身。联机场不给这个入口：作废等于删别人的房间，
        // 本次改版已去房主化，不恢复。
        items.push({ label: '🗑 作废本场', onclick: 'Room.voidLocal()', danger: true });
      }
      U.openSheet(items);
    },

    // 作废本场（仅本地场）：整条 session 删掉、不进历史，首页立刻恢复「开新一场（本地）」
    voidLocal() {
      if (!state.local || !state.session) return;
      if (!confirm('作废后本场所有记录将被删除、不进历史，确定作废？')) return;
      const sid = state.session.id;
      resetState();   // 用 resetState 不用 close：别把「回到联机房间」的房号也顺手清了
      host.onVoided(sid);
    },

    // 只读地看当前结算方案：结算页在 from==='room' 时每次重绘都现取快照，不存旧数据
    settle() {
      host.go({ name: 'settle', sid: snapshot().id, from: 'room' });
    },

    async finish() {
      // 升级前按「局」记的半场本地牌局只有 rounds 没有 tx。只看 tx 会把它判成「没记过分」而拒绝结算，
      // 于是它永远停在 active：首页永远显示「继续本场」、永远开不了新的本地场，且流水只增不删，
      // 用户只能靠记一笔假账脱身。本地场必须把 rounds 也算上（联机场没有 rounds，不受影响）。
      const hasOldRounds = state.local && (state.session.rounds || []).length > 0;
      if (!S.txList(state.room).length && !hasOldRounds) { alert('还没记过分，不能结算'); return; }
      if (!confirm('结束本场后不能再记分，确定吗？')) return;
      if (state.local) {
        localApply((s) => { s.status = 'finished'; s.finishedAt = new Date().toISOString(); });
        const snap = snapshot();
        close();
        host.onFinished(snap);
        return;
      }
      try {
        await S.patch(state.code, '/finishedAt', new Date().toISOString());
        await S.patch(state.code, '/status', 'finished');   // 各端收到推送后自己存历史、跳结算页
      } catch (e) { alert('结算失败：' + e.message); }
    },

    // 结算页的「关闭房间」：从云端删掉这个房间（战绩已存进各自手机）
    async closeRoom() {
      if (!confirm('关闭后房间从服务器删除（战绩已存进各自手机历史），确定？')) return;
      try {
        await S.deleteRoom(state.code);
        state.code = null; state.room = null;
        host.render();
      } catch (e) { alert('关闭失败：' + e.message); }
    },
  };
  if (typeof window !== 'undefined') window.Room = Room;

  // 座位/换人这类带「玩家」数据的按钮一律走 data-*，不把任何数据拼进内联 onclick——
  // onclick 的内容是当 JS 源码编译的，浏览器会先把属性值里的 &#39; 解回 '，esc() 只挡得住
  // HTML 属性这一层，挡不住紧接着的 JS 字符串拼接（pid/名字都可能来自别的设备，不可信）。
  if (typeof document !== 'undefined') {
    document.addEventListener('click', (ev) => {
      const t = ev.target;
      const el = t && t.closest ? t.closest('[data-room-act]') : null;
      if (!el) return;
      const pid = el.getAttribute('data-pid');
      const act = el.getAttribute('data-room-act');
      if (act === 'seat') Room.tapSeat(pid);
      else if (act === 'payer') Room.setPayer(pid);
    });
  }

  const api = { init, preview, attach, close, lastName, startLocal, snapshot, state,
    views: { joinName: joinView, room: roomView } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

</script>
<script>
(() => {
  'use strict';
  const L = RunfastLogic, U = RunfastUI, R = RunfastRoom;
  const esc = U.esc, topbar = U.topbar, validName = U.validName;
  const STORE_KEY = 'runfast.v1';

  // ---------- 存储 ----------
  function loadDB() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.version === 1 && Array.isArray(data.sessions) && Array.isArray(data.playerDirectory)) return data;
      }
    } catch (e) { /* 损坏数据按空库处理 */ }
    return { version: 1, playerDirectory: [], sessions: [] };
  }
  function saveDB() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
    catch (e) { alert('保存失败：浏览器本地存储不可用（可能是无痕模式）。请尽快导出备份！'); }
  }
  let db = loadDB();

  // ---------- 工具 ----------
  const $app = document.getElementById('app');
  const yuan = (fen) => L.fenToYuan(fen);
  const signYuan = (fen) => (fen > 0 ? '+' : '') + L.fenToYuan(fen);
  const cls = (fen) => (fen > 0 ? 'pos' : fen < 0 ? 'neg' : '');
  const fmtDate = (iso) => {
    const d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const fmtTime = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };
  const activeSession = () => db.sessions.find((s) => s.status === 'active') || null;

  // ---------- 导航与渲染 ----------
  let view = { name: 'home' };
  function go(v) { U.closeSheet(); view = v; render(); window.scrollTo(0, 0); }
  const VIEWS = {};
  function render() { $app.innerHTML = VIEWS[view.name](); }

  // ---------- 首页 ----------
  VIEWS.home = () => {
    const act = activeSession();
    let lastRoom = null;
    try { lastRoom = JSON.parse(localStorage.getItem('runfast.sync.room') || 'null'); } catch (e) { /* 忽略 */ }
    return `
      <h1 style="text-align:center;margin:20px 0 18px">🃏 跑得快记分</h1>
      ${view.notice ? `<div class="notice"><span>${esc(view.notice)}</span><button class="notice-x" onclick="App.dismissNotice()">×</button></div>` : ''}
      ${lastRoom && RunfastSync.configured() ? `<button class="btn btn-primary" onclick="App.rejoinRoom()">回到联机房间（${esc(lastRoom.code)}）</button><div class="gap"></div>` : ''}
      ${act ? `<button class="btn btn-primary" onclick="App.goSession()">继续本场（${act.players.map(esc).join('、')}）</button><div class="gap"></div>` : ''}
      <button class="btn btn-primary btn-hero" onclick="App.goOnlineSetup()">创建联机场<small>开个房间，牌友扫码进来一起记</small></button>
      <div class="gap"></div>
      <button class="btn" onclick="App.goJoinRoom()">加入联机场</button>
      <div class="gap"></div>
      <div style="display:flex;gap:10px">
        ${act ? '' : '<button class="btn btn-ghost" onclick="App.goSetup()">开新一场（本地）</button>'}
        <button class="btn btn-ghost" onclick="App.goHistory()">历史记录</button>
      </div>
      <div class="gap"></div>
      <div class="card">
        <div class="muted" style="margin-bottom:10px">数据保存在本手机浏览器里，换手机或清缓存前请先导出</div>
        <button class="btn btn-sm" onclick="App.exportData()">导出备份</button>
        <button class="btn btn-sm" onclick="App.importData()">导入备份</button>
      </div>`;
  };

  // ---------- 开新一场 / 创建联机场（同一张表单，按 view.mode 换文案） ----------
  VIEWS.setup = () => {
    const isOnline = view.mode === 'online';
    const dir = db.playerDirectory;
    // 注意：路由对象上的 name 是视图名，用户输入的名字存在 myName 上
    return `
      ${topbar(isOnline ? '创建联机场' : '开新一场（本地）', 'App.goHome()')}
      <div class="card">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
          <span>${isOnline ? '你的名字' : '这一场有谁'}</span>
          ${dir.length ? `<button class="btn btn-sm" onclick="App.toggleManage()">${view.manage ? '完成' : '管理名录'}</button>` : ''}
        </div>
        ${view.manage
          ? dir.map((n) => `<div class="row"><span>${esc(n)}</span>
              <div style="flex-shrink:0">
                <button class="btn btn-sm" onclick="App.renameDirName('${esc(n)}')">改名</button>
                <button class="btn btn-sm" onclick="App.deleteDirName('${esc(n)}')">删除</button>
              </div></div>`).join('') +
            '<div class="muted" style="margin-top:8px">改名/删除只影响这里的常用名单，不影响历史战绩。</div>'
          : `<input type="text" id="myName" maxlength="8" placeholder="${isOnline ? '输入你的名字（8 字以内）' : '玩家名字（8 字以内）'}" value="${esc(view.myName || '')}">
             ${dir.length ? `<div class="chips" style="margin-top:10px">${dir.map((n) =>
               `<button class="chip ${!isOnline && view.sel.includes(n) ? 'on' : ''}" onclick="App.pickName('${esc(n)}')">${esc(n)}</button>`).join('')}</div>` : ''}
             ${isOnline
               ? '<div class="muted" style="margin-top:10px">建好后把二维码发给牌友，他们扫码进来自己输名字。没带手机的人，进去以后点「＋加人」补上。</div>'
               : `<div style="margin-top:10px"><button class="btn btn-sm" onclick="App.addLocalPlayer()">加入这一场</button></div>
                  ${view.sel.length ? `<div class="muted" style="margin-top:10px">本场玩家（${view.sel.length}）：${view.sel.map(esc).join('、')}</div>` : ''}`}`}
      </div>
      <div class="card">
        <div class="section-title">每张牌单价（元）</div>
        <input type="text" id="price" inputmode="decimal" value="${esc(view.price)}" placeholder="如 1 或 0.5">
      </div>
      <button class="btn btn-primary" onclick="App.startSession()">${isOnline ? '创建房间' : '开始记分'}</button>`;
  };

  // 历史旧场的每局明细（新场是流水，不再有「局」）
  function roundRow(s, r, i) {
    const detail = L.roundTransfers(r, s.pricePerCardFen)
      .map((t) => `${esc(t.from)} ${t.cards}张`).join('，');
    return `<div class="row">
      <div><b>第${i + 1}局</b> ${esc(r.winner)} 赢${r.at ? ` <span class="muted">${fmtTime(r.at)}</span>` : ''}
        <div class="muted">${detail || '其他人也都出完了'}</div></div>
    </div>`;
  }

  // ---------- 结算页（记分页「⋯ → 结算方案」& 结束本场后 & 历史详情共用） ----------
  // 结算页看的可能是「房间的当前快照」（随时可看，实时），也可能是「历史里的一场」
  function settleSession() {
    if (view.from === 'room') return R.state.active ? R.snapshot() : null;
    return db.sessions.find((x) => x.id === view.sid);
  }

  VIEWS.settle = () => {
    const s = settleSession();
    if (!s) return VIEWS.home();
    const backJs = view.from === 'history' ? 'App.goHistory()'
      : view.from === 'room' ? 'App.backToRoom()' : 'App.goHome()';
    const net = L.sessionNet(s).slice().sort((a, b) => b.fen - a.fen);
    const pays = L.settleUp(L.sessionNet(s));
    return `
      ${topbar(fmtDate(s.createdAt) + ' 战绩', backJs)}
      <div class="card">
        <div class="section-title">${view.from === 'room' ? '当前' : '最终'}盈亏（${L.sessionSize(s)} · ${yuan(s.pricePerCardFen)}元/张）</div>
        ${net.map((p) => `<div class="row"><span>${esc(p.name)}</span>
          <span class="${cls(p.fen)}">${p.cards > 0 ? '+' : ''}${p.cards} 张 · ${signYuan(p.fen)} 元</span></div>`).join('')}
      </div>
      <div class="card">
        <div class="section-title">💸 转账方案（最少笔数）</div>
        ${pays.map((t) => `<div class="row"><span>${esc(t.from)} 转给 ${esc(t.to)}</span><span class="pos">${yuan(t.fen)} 元</span></div>`).join('')
          || '<div class="muted">全部打平，无需转账</div>'}
      </div>
      <button class="btn btn-primary" onclick="App.shareImage()">📤 分享战绩图</button>
      <div class="gap"></div>
      <button class="btn" onclick="App.copyText()">📋 复制战绩文字</button>
      ${s.rounds && s.rounds.length
        ? '<div class="gap"></div><button class="btn" onclick="App.goRoundsFromSettle()">查看每局明细</button>' : ''}
      ${!R.state.active && R.state.code && R.state.room
        && R.state.room.creatorUid === R.state.uid
        && R.state.room.sid === s.id ? `<div class="gap"></div>
      <button class="btn" onclick="Room.closeRoom()">关闭房间（牌友都保存后再关）</button>` : ''}`;
  };

  // ---------- 每局明细（只读） ----------
  // 只有历史里按局记的旧场才有「每局明细」；新场是流水，直接在记分页看
  VIEWS.rounds = () => {
    const s = db.sessions.find((x) => x.id === view.sid);
    if (!s) return VIEWS.home();
    return `
      ${topbar('每局明细', 'App.backFromRounds()')}
      <div class="card">${s.rounds.map((r, i) => roundRow(s, r, i)).join('')
        || '<div class="muted">本场没有记录任何一局</div>'}</div>`;
  };

  // ---------- 历史记录 ----------
  // 行上的 sid 可能来自别人的房间快照（服务器不校验 sid），一律走 data-* + 事件委托，
  // 不拼进 onclick —— 那是当 JS 源码编译的位置，esc() 挡不住。
  VIEWS.history = () => {
    const list = db.sessions.filter((s) => s.status === 'finished')
      .sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    if (!list.length) {
      return `${topbar('历史记录', 'App.goHome()')}
        <div class="card"><div class="muted">还没有打完的场</div></div>`;
    }
    const edit = !!view.editMode;
    const sel = view.sel || [];
    const actions = edit
      ? '<button class="icon-btn" onclick="App.historyEditOff()">完成</button>'
      : '<button class="icon-btn" onclick="App.historyEditOn()">编辑</button>';
    const allSel = sel.length === list.length;
    const bar = edit ? `<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px">
        <button class="btn btn-sm" onclick="App.historySelectAll()">${allSel ? '取消全选' : '全选'}</button>
        <button class="btn btn-sm btn-danger" ${sel.length ? '' : 'disabled style="opacity:.4"'} onclick="App.historyDeleteSel()">删除所选（${sel.length}）</button>
      </div>` : '';
    return `
      ${topbar('历史记录', 'App.goHome()', actions)}
      ${bar}
      <div class="card">
        ${list.map((s) => {
          const info =`<div><b>${fmtDate(s.createdAt)}</b><div class="muted">${s.players.map(esc).join('、')}</div></div>`;
          if (edit) {
            const on = sel.includes(s.id);
            const box = on
              ? '<span style="flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--felt-light);color:#fff;text-align:center;line-height:22px;font-size:14px">✓</span>'
              : '<span style="flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;display:inline-block"></span>';
            return `<div class="row" data-app-act="pick" data-sid="${esc(s.id)}" style="cursor:pointer">
              <span style="display:flex;align-items:center;gap:12px">${box}${info}</span></div>`;
          }
          return `<div class="row" data-app-act="open" data-sid="${esc(s.id)}" style="cursor:pointer">
            ${info}<span class="muted">${L.sessionSize(s)} ›</span></div>`;
        }).join('')}
      </div>`;
  };

  // ---------- 加入联机场 ----------
  VIEWS.joinRoom = () => `
    ${topbar('加入联机场', 'App.goHome()')}
    <div class="card">
      <div class="section-title">粘贴邀请链接，或输入 6 位房号</div>
      <input type="text" id="roomCode" placeholder="如 314159，或直接粘贴房主发的整段邀请" value="${view.code ? esc(view.code) : ''}">
      <div class="gap"></div>
      <button class="btn btn-primary" onclick="App.joinRoomSubmit()">进入房间</button>
      <div class="muted" style="margin-top:10px">${view.code
        ? '房号已自动填好，点「进入房间」即可（若进不去，可能房主还没建好或已关闭，稍等再试）。'
        : '房主发到群里的那段话整条粘进来就行，会自动认出房号；也可以直接扫房主分享的二维码进房。'}</div>
    </div>`;

  // ---------- 导入前校验 ----------
  // id 长度上限跟服务端的 KEY_RE（server.js 的 1~64）对齐：口径不一致时，服务端收下的
  // tx id / pid 在这里会被判非法，代价是「整份备份一条都导不回来」。
  const validId = (s) => typeof s === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(s);
  function importValid(data) {
    const names = new Set(data.playerDirectory);
    let activeCount = 0;
    for (const s of data.sessions) {
      if (!validId(s.id)) return false;
      if (!(Number.isInteger(s.pricePerCardFen) && s.pricePerCardFen > 0)) return false;
      if (!(s.status === 'active' || s.status === 'finished')) return false;
      if (!(Array.isArray(s.players) && Array.isArray(s.rounds))) return false;
      if (new Set(s.players).size !== s.players.length) return false;
      // 旧场才有 activePlayers（在场名单）；新的流水场没有这个字段
      if (s.activePlayers !== undefined) {
        if (!Array.isArray(s.activePlayers)) return false;
        if (new Set(s.activePlayers).size !== s.activePlayers.length) return false;
        if (!s.activePlayers.every((n) => s.players.includes(n))) return false;
        s.activePlayers.forEach((n) => names.add(n));
      }
      if (s.status === 'active') activeCount++;
      s.players.forEach((n) => names.add(n));
      if (s.transfers !== undefined) {
        if (!Array.isArray(s.transfers)) return false;
        for (const t of s.transfers) {
          if (!validId(t.id)) return false;
          if (!s.players.includes(t.from) || !s.players.includes(t.to)) return false;
          if (t.from === t.to) return false;
          if (!(Number.isInteger(t.points) && t.points > 0 && t.points <= 9999)) return false;
        }
      }
      for (const r of s.rounds) {
        if (!validId(r.id)) return false;
        if (r.at !== undefined && typeof r.at !== 'string') return false;
        if (typeof r.winner !== 'string' || !s.players.includes(r.winner)) return false;
        if (!Array.isArray(r.losers)) return false;
        for (const l of r.losers) {
          if (!s.players.includes(l.name)) return false;
          if (!(Number.isInteger(l.cardsLeft) && l.cardsLeft >= 0 && l.cardsLeft <= 10)) return false;
          if (typeof l.shutout !== 'boolean') return false;
        }
        names.add(r.winner);
        r.losers.forEach((l) => names.add(l.name));
      }
    }
    if (activeCount > 1) return false;
    return Array.from(names).every((n) => validName(n));
  }

  // 房间的两个视图挂进路由；房间需要的宿主能力在这里注入
  VIEWS.joinName = () => R.views.joinName();
  VIEWS.room = () => R.views.room();

  R.init({
    go,
    render,
    view: () => view,
    directory: () => db.playerDirectory,
    // 记住这个名字：进下一个房间时自动填、并进常用名录做快选
    saveName(name) {
      try { localStorage.setItem('runfast.lastName', name); } catch (e) { /* 忽略 */ }
      if (!db.playerDirectory.includes(name)) { db.playerDirectory.push(name); saveDB(); }
    },
    saveLocal() { saveDB(); render(); },
    // 本场作废（仅本地场）：整条删掉、不进历史，首页随即恢复「开新一场（本地）」
    onVoided(sid) {
      db.sessions = db.sessions.filter((x) => x.id !== sid);
      saveDB();
      go({ name: 'home' });
    },
    // 本场结束：快照存进本机历史（幂等），跳结算页
    onFinished(session) {
      const snap = JSON.parse(JSON.stringify(session));
      snap.status = 'finished';
      const i = db.sessions.findIndex((x) => x.id === snap.id);
      if (i >= 0) db.sessions[i] = snap; else db.sessions.push(snap);
      saveDB();
      go({ name: 'settle', sid: snap.id, from: 'home' });
    },
  });

  // ---------- 交互 ----------
  const App = {
    goHome: () => go({ name: 'home' }),
    dismissNotice() { view.notice = null; render(); },
    goSetup: () => go({ name: 'setup', sel: [], myName: '', price: '1', manage: false }),
    goHistory: () => go({ name: 'history', editMode: false, sel: [] }),
    historyEditOn() { view.editMode = true; view.sel = []; render(); },
    historyEditOff() { view.editMode = false; view.sel = []; render(); },
    historyToggle(id) {
      view.sel = view.sel || [];
      view.sel = view.sel.includes(id) ? view.sel.filter((x) => x !== id) : view.sel.concat(id);
      render();
    },
    historySelectAll() {
      const ids = db.sessions.filter((s) => s.status === 'finished').map((s) => s.id);
      view.sel = (view.sel && view.sel.length === ids.length) ? [] : ids;
      render();
    },
    historyDeleteSel() {
      const sel = view.sel || [];
      if (!sel.length) return;
      if (!confirm('删除所选的 ' + sel.length + ' 场历史记录？删除后无法恢复。')) return;
      db.sessions = db.sessions.filter((s) => !sel.includes(s.id));
      saveDB();
      view.sel = [];
      view.editMode = false;
      render();
    },

    goOnlineSetup() {
      if (!RunfastSync.configured()) { alert('联机要在房主电脑上启动「跑得快联机」服务后，用手机扫主机页二维码进入才能用'); return; }
      go({ name: 'setup', sel: [], myName: R.lastName(), price: '1', manage: false, mode: 'online' });
    },

    goJoinRoom() {
      if (!RunfastSync.configured()) { alert('联机要在房主电脑上启动「跑得快联机」服务后，用手机扫主机页二维码进入才能用'); return; }
      go({ name: 'joinRoom' });
    },

    joinRoomSubmit() {
      const raw = document.getElementById('roomCode').value;
      const code = RunfastSync.parseRoomCode(raw);
      if (!code) { alert('没认出房号。把房主发的那段邀请整条粘进来，或者直接输 6 位数字。'); return; }
      R.preview(code);
    },

    rejoinRoom() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem('runfast.sync.room') || 'null'); } catch (e) { /* 忽略 */ }
      if (saved && RunfastSync.validRoomCode(saved.code)) R.preview(saved.code);
      else { localStorage.removeItem('runfast.sync.room'); render(); }
    },

    // 名录里的名字：联机场填进「我的名字」，本地场是勾选本场玩家
    pickName(n) {
      view.price = document.getElementById('price').value;
      if (view.mode === 'online') { document.getElementById('myName').value = n; return; }
      const i = view.sel.indexOf(n);
      if (i >= 0) view.sel.splice(i, 1); else view.sel.push(n);
      render();
    },

    addLocalPlayer() {
      const name = document.getElementById('myName').value.trim();
      if (!validName(name)) { alert('名字需 1～8 个字，且不能含引号等特殊符号'); return; }
      if (view.sel.includes(name)) { alert('这一场已经有这个名字了'); return; }
      view.price = document.getElementById('price').value;
      if (!db.playerDirectory.includes(name)) db.playerDirectory.push(name);
      view.sel.push(name);
      saveDB();
      view.myName = '';
      render();
    },

    toggleManage() {
      view.price = document.getElementById('price').value;
      view.manage = !view.manage;
      render();
    },

    renameDirName(name) {
      const next = (window.prompt('把「' + name + '」改为（不影响历史战绩）：', name) || '').trim();
      if (!next || next === name) return;
      if (!validName(next)) { alert('名字需 1～8 个字，且不能含引号等特殊符号'); return; }
      if (db.playerDirectory.includes(next)) { alert('名单里已有这个名字'); return; }
      view.price = document.getElementById('price').value;
      db.playerDirectory = db.playerDirectory.map((n) => (n === name ? next : n));
      view.sel = view.sel.map((n) => (n === name ? next : n));
      saveDB();
      render();
    },

    deleteDirName(name) {
      if (!confirm('从常用名单删除「' + name + '」？不影响历史战绩。')) return;
      view.price = document.getElementById('price').value;
      db.playerDirectory = db.playerDirectory.filter((n) => n !== name);
      view.sel = view.sel.filter((n) => n !== name);
      if (!db.playerDirectory.length) view.manage = false;
      saveDB();
      render();
    },

    async startSession() {
      const priceFen = L.yuanToFen(document.getElementById('price').value.trim());
      if (Number.isNaN(priceFen)) { alert('单价格式不对，例：1 或 0.5'); return; }
      if (view.mode === 'online') {
        const name = (document.getElementById('myName').value || '').trim();
        if (!validName(name)) { alert('名字需 1～8 个字，且不能含引号等特殊符号'); return; }
        try {
          const { code, pid } = await RunfastSync.createRoom({ name, pricePerCardFen: priceFen });
          if (!db.playerDirectory.includes(name)) { db.playerDirectory.push(name); saveDB(); }
          try { localStorage.setItem('runfast.lastName', name); } catch (e) { /* 忽略 */ }
          await R.attach(code, pid);
        } catch (e) { alert('建房失败：' + e.message); }
        return;
      }
      if (view.sel.length < 2) { alert('本地场至少要 2 个玩家'); return; }
      if (activeSession()) { App.goSession(); return; }
      const session = {
        id: 's' + Date.now(),
        createdAt: new Date().toISOString(),
        pricePerCardFen: priceFen,
        players: view.sel.slice(),
        status: 'active',
        rounds: [],
        transfers: [],
      };
      db.sessions.push(session);
      saveDB();
      R.startLocal(session);
    },

    goSession() {
      const s = activeSession();
      if (!s) { App.goHome(); return; }
      R.startLocal(s);
    },

    goSettle: (sid, from) => go({ name: 'settle', sid, from: from || 'home' }),
    backToRoom() { go({ name: 'room' }); },
    // 结算页 ↔ 每局明细：sid / from 都从当前 view 取，不拼进 onclick
    goRoundsFromSettle() {
      const s = settleSession();
      if (s) go({ name: 'rounds', sid: s.id, from: view.from });
    },
    backFromRounds() { go({ name: 'settle', sid: view.sid, from: view.from }); },

    async copyText() {
      const s = settleSession();
      if (!s) return;
      const ok = await U.copyToClipboard(L.summaryText(s));
      alert(ok ? '已复制，去粘贴发给牌友吧' : '复制失败，请改用「分享战绩图」或截图');
    },

    shareImage() { const s = settleSession(); if (s) RunfastShare.share(s, L); },

    exportData() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'runfast-backup-' + fmtDate(new Date().toISOString()) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    },

    importData() {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.style.display = 'none';
      document.body.appendChild(inp);
      inp.onchange = () => {
        const f = inp.files[0];
        if (!f) { inp.remove(); return; }
        const r = new FileReader();
        r.onload = () => {
          try {
            const data = JSON.parse(r.result);
            if (data.version !== 1 || !Array.isArray(data.sessions) || !Array.isArray(data.playerDirectory)) {
              throw new Error('bad format');
            }
            if (!importValid(data)) throw new Error('bad format');
            if (!confirm('导入将覆盖本手机上现有的全部记分数据，确定？')) return;
            db = data;
            saveDB();
            go({ name: 'home' });
            alert('导入成功');
          } catch (e) { alert('文件格式不对，导入失败'); }
          finally { inp.remove(); }
        };
        r.readAsText(f);
      };
      inp.click();
    },
  };
  window.App = App;

  // 历史列表的行带 sid，走 data-* 事件委托（见 VIEWS.history 的注释）
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    const el = t && t.closest ? t.closest('[data-app-act]') : null;
    if (!el) return;
    const sid = el.getAttribute('data-sid');
    const act = el.getAttribute('data-app-act');
    if (act === 'open') App.goSettle(sid, 'history');
    else if (act === 'pick') App.historyToggle(sid);
  });

  // 开场路由：扫码/链接带房号就进那个房；否则只要本机还记着房号（没点过「退出房间」），
  // 就自动回到那个房间的记分页——用户切后台、刷新、重开浏览器都算「还在房里」，
  // 不该每次都先落到首页再手动点一次。房间没了就安静回首页，不弹窗。
  const roomParam = location.search.match(/[?&]room=([0-9]{6})\b/);
  let savedRoom = null;
  try { savedRoom = JSON.parse(localStorage.getItem('runfast.sync.room') || 'null'); } catch (e) { /* 忽略 */ }
  if (RunfastSync.configured()) {
    if (roomParam) {
      // 用掉就把 ?room= 从地址栏抹掉：留着的话每次刷新都重跑一遍进房，
      // 房间要是已经关了就变成「刷一次弹一次」。分享链接是分享按钮另外拼的，不受影响。
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* 忽略 */ }
      R.preview(roomParam[1]);
    } else if (savedRoom && RunfastSync.validRoomCode(savedRoom.code)) {
      R.preview(savedRoom.code, { silent: true });
    }
  }

  render();
})();

</script>
</body>
</html>
